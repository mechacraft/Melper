<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Mechabellum unit tables, damage math, breakpoints and buy advice." />
    <!-- Installed windows take their frame colour from the manifest; this covers mobile browser UI. -->
    <meta name="theme-color" content="#212529" />
    <title>Melper</title>
    <base href="/" />
    <script>
        // Applied before any stylesheet renders so there is no flash of the wrong theme.
        (function () {
            var theme = 'dark';
            try {
                if (localStorage.getItem('theme') === 'light') {
                    theme = 'light';
                }
            } catch (e) {
                // localStorage unavailable (private mode) - fall back to the dark default
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Melper.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <div id="pwa-update-ui" class="alert alert-primary m-0 rounded-0 shadow" hidden>
        <span class="flex-grow-1">A new version of Melper is available.</span>
        <button type="button" class="btn btn-sm btn-primary reload">Reload</button>
        <button type="button" class="btn-close dismiss" aria-label="Dismiss"></button>
    </div>

    <script>
        // Saving generated text as a file has no Blazor-side equivalent - the Data
        // page's export calls this. Object URL rather than a data: URL so the roster
        // is not capped by the browser's limit on how long a URL may be.
        window.melperDownload = function (filename, text) {
            var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
            var link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            // Revoked late: Firefox cancels a download whose URL dies too soon after the click.
            setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Offline support and the install prompt both hang off the service worker;
        // skip it where there is none (file://, plain-http origins other than localhost).
        if ('serviceWorker' in navigator) {
            // Installed as an app, the window can stay open for days without a
            // navigation, so nothing would otherwise check for a new deployment.
            const updateCheckIntervalMs = 60 * 60 * 1000;

            navigator.serviceWorker.register('service-worker.js').then(registration => {
                const bar = document.getElementById('pwa-update-ui');

                // A cache-first worker keeps serving the old assets until it is
                // replaced, and it only steps aside once every client is gone -
                // which in a standalone window may be never. Hence the prompt.
                const promptForUpdate = worker => {
                    bar.querySelector('.reload').onclick = () => worker.postMessage({ type: 'SKIP_WAITING' });
                    bar.querySelector('.dismiss').onclick = () => bar.hidden = true;
                    bar.hidden = false;
                };

                if (registration.waiting) {
                    promptForUpdate(registration.waiting);
                }

                registration.addEventListener('updatefound', () => {
                    const installing = registration.installing;
                    installing.addEventListener('statechange', () => {
                        // No controller means this is the first install, not an update.
                        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                            promptForUpdate(installing);
                        }
                    });
                });

                setInterval(() => registration.update(), updateCheckIntervalMs);
            }).catch(error => console.warn('Service worker registration failed', error));

            // The new worker takes over the page once it stops waiting; reloading
            // then is what swaps in the new assets. Blazor pulls assemblies in
            // lazily, so reloading is also what keeps them all on one version.
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!reloading) {
                    reloading = true;
                    location.reload();
                }
            });
        }
    </script>
</body>

</html>
